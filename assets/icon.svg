<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Sleek Code Brackets & Pen / Spark Design -->
  <g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
    <!-- Left Bracket < -->
    <path d="M 170 180 L 110 256 L 170 332" fill="none" stroke="url(#glowGrad)" stroke-width="28"/>

    <!-- Right Bracket > -->
    <path d="M 342 180 L 402 256 L 342 332" fill="none" stroke="url(#glowGrad)" stroke-width="28"/>

    <!-- Center Slash / Core Beam / Notepad Lines -->
    <path d="M 280 150 L 230 362" fill="none" stroke="url(#accentGrad)" stroke-width="24"/>
  </g>

  <!-- Code Dots / Notepad Bindings -->
  <circle cx="160" cy="100" r="12" fill="#ef4444"/>
  <circle cx="200" cy="100" r="12" fill="#f59e0b"/>
  <circle cx="240" cy="100" r="12" fill="#10b981"/>
</svg>